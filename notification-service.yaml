server:
  port: 5010
spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:airline-admin@gmail.com}
    password: ${MAIL_APP_PASSWORD:pnrb gkyu brhr eexo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
        debug: false
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML
    cache: false
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group

notification:
  from-email: ${MAIL_FROM:airline-admin@gmail.com}
  from-name: Airline Notification
  checkin-url: "frontend url"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
    registry-fetch-interval-seconds: 20
    eureka-server-connect-timeout-seconds: 5
    eureka-server-read-timeout-seconds: 10
    disable-delta: false   # keep delta enabled for performance
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    metadata-map:
      instanceId: ${spring.application.name}:${spring.application.instance_id:${random.value}}